# vrdesk headless sway config
# Virtual monitors are created with WLR_HEADLESS_OUTPUTS / swaymsg create_output.
output HEADLESS-1 resolution 1920x1080 position 0 0 bg #1e1e2e solid_color
output HEADLESS-2 resolution 1280x720 position 1920 0 bg #181825 solid_color

# No bar, no seat devices needed for the headless test.
default_border pixel 2
default_border_color #89b4fa
focused_border_color #f38ba8
font pango:monospace 11

# Keep windows floating so pointer injection is predictable.
for_window [app_id=".*"] floating enable

# Useful keybindings when a human attaches with a nested session.
bindsym $mod+Return exec foot
bindsym $mod+Shift+q kill
